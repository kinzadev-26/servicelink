services:
  - type: web
    name: servicelink-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            
      - key: CLIENT_URL
        sync: false            # your live frontend address, e.g. https://your-project.vercel.app
      - key: JWT_SECRET
        generateValue: true    
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"